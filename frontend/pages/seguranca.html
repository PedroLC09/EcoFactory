<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Segurança</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>EcoFactory</h2>

        <nav>

            <a href="dashboard.html">Dashboard</a>

            <a href="maquinas.html">Máquinas</a>

            <a href="producoes.html">Produções</a>

            <a href="seguranca.html">Segurança</a>

        </nav>

    </aside>

    <main class="content">

        <h1>Registro de Ocorrências de Segurança</h1>

        <form id="safetyForm">

            <input
                type="text"
                id="titulo"
                placeholder="Título da Ocorrência"
                required
            >

            <select id="maquina" required>

                <option value="">
                    Selecione a Máquina
                </option>

            </select>

            <input
                type="text"
                id="responsavel"
                placeholder="Responsável"
                required
            >

            <input
                type="date"
                id="data"
                required
            >

            <select id="gravidade" required>

                <option value="BAIXA">
                    Baixa
                </option>

                <option value="MEDIA">
                    Média
                </option>

                <option value="ALTA">
                    Alta
                </option>

            </select>

            <textarea
                id="descricao"
                placeholder="Descrição da ocorrência"
                rows="4"
                required
            ></textarea>

            <button>

                Registrar Ocorrência

            </button>

        </form>

        <br>

        <table>

            <thead>

                <tr>

                    <th>Título</th>

                    <th>Máquina</th>

                    <th>Responsável</th>

                    <th>Gravidade</th>

                    <th>Data</th>

                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="safetyTable">

            </tbody>

        </table>

    </main>

</div>

<script src="../js/seguranca.js"></script>

</body>

</html>
